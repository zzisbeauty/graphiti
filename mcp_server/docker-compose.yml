services:  
  graphiti-mcp:  
    image: zepai/knowledge-graph-mcp:latest
    env_file:
      - .env
    build:  
      context: .  
      dockerfile: Dockerfile  
    environment:  
      # Neo4j 配置  
      - NEO4J_URI=bolt://192.168.1.6:7689  
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=aa1230.aa2  
      # Embedding 服务配置  
      - EMBEDDER_MODEL_NAME=BAAI/bge-large-zh-v1.5
      - AZURE_OPENAI_EMBEDDING_ENDPOINT=https://api.siliconflow.cn/v1  
      - AZURE_OPENAI_EMBEDDING_API_KEY=sk-fzmwrgrwxbiylqqetuhbyumnahrqsdnyiqdqkkdslfmrjtotcfb
      - AZURE_OPENAI_EMBEDDING_API_VERSION=2023-05-15
      # LLM 配置 (使用您的 vLLM 服务)
      - OPENAI_API_KEY=sk-fzmwuTITomWJ5hVYsVb304d3f94Ec144e3bAa5eCc11Ff6aA0E9
      - MODEL_NAME=/app/models/custom/Qwen3-4B-Thinking-2507
      - OPENAI_BASE_URL=http://192.168.1.6:5915/v1
      - LLM_TEMPERATURE=0.2
      # MCP 服务器配置
      - MCP_SERVER_HOST=0.0.0.0  
      - SEMAPHORE_LIMIT=10  
      - GRAPHITI_TELEMETRY_ENABLED=false  
      # 路径配置  
      - PATH=/root/.local/bin:${PATH}  
    ports:  
      - "5905:8000" # 宿主机5904映射到容器8000  
    volumes:  
      # 挂载您的自定义配置和数据  
      - ./entities:/app/entities  
      - ./examples/data:/app/examples/data  
      - ./modelconfig.py:/app/modelconfig.py  
    command: ["uv", "run", "graphiti_mcp_server.py", "--transport", "sse", "--use-custom-entities", "--group-id", "my_project", "--host", "0.0.0.0"]
